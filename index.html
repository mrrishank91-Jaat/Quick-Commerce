<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick-Commerece</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="logo">Quick<span>It</span></h1>
        <div class="location">
            <span>Choose Your Location:</span>
            <select id="ad">
                <option value="GLA Univ Gate-1">GLA Univ Gate-1</option>
                <option value="GLA Univ Gate-2">GLA Univ Gate-2</option>
                <option value="GLA Univ New Gate">GLA Univ New Gate</option>
                <option value="GLA Univ KV Hostel">GLA Univ KV Hostel</option>
            </select>
        </div>
        <div class="search">
            <input type="text" placeholder="Search 'products'" id="search">  
        </div>
        <button type="button" id="login-btn">Login</button>
        <button type="button" class="cart-btn" id="cart-btn"><img src="images/cart.png" alt="Cart" class="cart-icon">My Cart</button>
    </header>
    <section class="banner">
        <a href="#">
            <img src="images/veggies.png.png" alt="veggies/products">
        </a>
    </section>
    
    <section class="cards">
        <a href="#" class="cards"><img src="images/card1.png" alt="Product 1"></a>
        <a href="#" class="cards"><img src="images/card2.png" alt="Product 2"></a>
        <a href="#" class="cards"><img src="images/card3.png" alt="Product 3"></a>
    </section>
</body>
</html>
